(function(){

const expected=[77,121,115,111,110,112,114,97,99,116,105,99,101,54,54,64,103,105,116,104,117,98];
function check(value){if(value.length!==expected.length)return false;let diff=0;for(let i=0;i<expected.length;i++)diff|=value.charCodeAt(i)^expected[i];return diff===0}

try{if(sessionStorage.getItem('adventure-unlocked')==='yes')unlock()}catch(e){}
if(!gate.hidden){document.body.style.overflow='hidden';input.focus()}
