if(active!==null)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();e.stopImmediatePropagation();active=e.pointerId;last=xy(e);try{c.setPointerCapture(e.pointerId)}catch(_){}ctx.beginPath();ctx.arc(last[0],last[1],1.5,0,Math.PI*2);ctx.fillStyle='#5e35b1';ctx.fill();ctx.strokeStyle='#5e35b1';ctx.lineWidth=e.pointerType==='pen'?2.7:3.2;ctx.lineCap='round';ctx.lineJoin='round'}\nfunction move(e){if(e.pointerId!==active)return;e.preventDefault();e.stopImmediatePropagation();const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)draw(ev)}\nfunction finish(e){if(e.pointerId!==active)return;e.preventDefault();e.stopImmediatePropagation();if(e.type==='pointerup')draw(e);active=null;last=null;snapshot()}\nfor(const [name,fn] of [['pointerdown',begin],['pointermove',move],['pointerup',finish],['pointercancel',finish],['lostpointercapture',finish]])c.addEventListener(name,fn,{capture:true,passive:false});\nfor(const name of ['touchstart','touchmove','touchend'])c.addEventListener(name,e=>{if(e.cancelable)e.preventDefault()},{passive:false});\nconst oldClear=window.clearBoard;window.clearBoard=function(){active=null;oldClear();snapshot()};\nsnapshot();\n})();";
