<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>偶像公主｜英文冒險</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fdf2fa}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff0f9;box-shadow:0 2px 8px #b8579529;gap:10px}.bar a{background:#7952c9;color:white;border-radius:12px;padding:10px 15px;text-decoration:none;font-size:16px;font-weight:bold}.bar span{font-size:15px;color:#88477c;font-weight:bold;text-align:right}iframe{display:block;width:100%;height:calc(100dvh - 58px);border:0;background:white}@media(max-width:400px){.bar span{font-size:12px}}</style></head><body><nav class="bar"><a href="./" aria-label="返回英文冒險學習中心目錄">← 返回單元目錄</a><span>🎤 偶像公主英語複習</span></nav><iframe title="偶像公主英語複習遊戲" src="./game.html" allow="autoplay"></iframe><script>
document.querySelector('iframe').addEventListener('load',function(){
  try {
    const frame=this;
    const fix=frame.contentDocument.createElement('script');
    fix.textContent="(()=>{try{const images={};for(const q of questions){if(q.img&&q.img.startsWith('data:image/'))images[q.name]=q.img;}for(const q of questions){if(q.img&&!q.img.startsWith('data:image/')&&images[q.name])q.img=images[q.name];}const popup=document.getElementById('pop-img');if(popup){popup.addEventListener('error',()=>{const q=questions[typeof curIdx==='number'?curIdx:0];if(q&&images[q.name])popup.src=images[q.name];});}}catch(e){console.warn('Image repair:',e)}})();";
    frame.contentDocument.body.appendChild(fix);
  } catch(e) {console.warn('Image repair unavailable:',e);}
});
</script></body></html>
