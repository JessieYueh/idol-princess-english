name: Assemble MOE Kai font
on:
  push:
    paths:
      - '.github/workflows/assemble-moe-kai.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete original font
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          folder = Path("chinese/units/nani-g5a-l05/fonts")
          blob = b"".join((folder / f"moe-kai-5.1.part-{i:02d}").read_bytes() for i in range(18))
          assert len(blob) == 8791000
          assert hashlib.sha256(blob).hexdigest() == "a6cd7fdef2baf445bf7d86e3106b0f7a3fe232bc6c696ab426b841c766a2ce40"
          (folder / "moe-kai-5.1.woff2").write_bytes(blob)
      - name: Commit complete font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chinese/units/nani-g5a-l05/fonts/moe-kai-5.1.woff2
          if ! git diff --cached --quiet; then
            git commit -m "Store complete MOE Kai font as one directly served WOFF2 file"
            git push
          fi
