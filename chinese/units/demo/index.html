<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國語星光練習｜偶像公主</title><link rel="stylesheet" href="style.css"><body>
<nav><a href="../../">← 國語作業</a><label>主題 <select id="theme"><option value="princess">偶像公主</option><option value="forest">森林配色</option></select></label></nav>
<header><small>秘密的偶像公主 · 國語練習室</small><h1>把每個字，寫成閃亮的星光 ✨</h1><p>先練字，再挑戰語詞測驗。</p><div class="team"><img src="../../../images/asset_7c3d93f72a48abe3.png" alt="陽葵"><span>陽葵 & 美月<br>陪你一起練習</span><img src="../../../images/asset_315fa71af096deba.jpg" alt="美月"></div></header>
<main><aside>初版示範課：這些語詞是示範資料，尚未套用孩子的課本。</aside>
<details><summary>家長設定｜貼上這一課的語詞</summary><p>每行：正確語詞 | 常見錯字 | 語詞解釋。設定與筆跡保存在此瀏覽器。</p><label>課程名稱 <input id="lessonTitle" maxlength="50" value="示範課｜容易寫錯的語詞"></label><textarea id="editor" rows="6" aria-label="語詞內容"></textarea><button id="apply">套用並開始新練習</button><p id="editStatus" role="status"></p></details>
<div class="steps"><strong id="title"></strong><span id="progress"></span></div>
<section id="practice"><div class="row"><span class="badge">① 星光練字</span><select id="wordSelect" aria-label="選擇語詞"></select></div><h2 id="word"></h2><p id="meaning"></p><div class="row"><label><input id="trace" type="checkbox" checked> 顯示淡色範字</label><label><input id="penOnly" type="checkbox"> 只用 Apple Pencil 書寫</label></div><p class="hint">每個字寫一格；想默寫時，關閉範字。可用手指或滑鼠。</p><canvas id="board" aria-label="田字格手寫區"></canvas><div class="row"><button id="undo">↶ 復原</button><button id="redo">↷ 重做</button><button id="clear">清除這一詞</button></div><p id="writeStatus" role="status"></p><button id="done" class="primary">已對照範字，完成這一詞 ✓</button><button id="start" class="secondary">② 全部練完，開始測驗 →</button><p class="hint">手寫由孩子／家長對照檢查；測驗選項自動判分。</p></section>
<section id="quiz" hidden><div class="row"><span class="badge">② 語詞測驗</span><button id="back">返回練字</button></div><p id="quizProgress"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status"></p><button id="next" class="primary" hidden>下一題 →</button></section>
<section id="result" hidden><span class="badge">③ 星光結算</span><h2>今天的練習完成了！🌟</h2><p id="score"></p><div id="review"></div><button id="retry" class="primary">再測驗一次</button><button id="practiceAgain">回到練字</button></section>
</main><dialog id="reward"><img id="rewardImg" alt="偶像公主的鼓勵"><h2>答對了！得到一顆星 ⭐</h2><p>你的國語星光又更亮了！</p><button id="closeReward" class="primary">繼續挑戰 →</button></dialog><audio id="voice" preload="none"></audio><script src="app.js"></script></body></html>
