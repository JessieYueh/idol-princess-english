<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九個單字｜運動與家庭英語冒險</title>
<style>
:root{font-family:ui-rounded,system-ui,"Noto Sans TC",sans-serif;color:#24453f;background:#edf8ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#ddf5e7,#fff9ed 75%)}header{padding:24px max(18px,calc((100vw - 960px)/2));background:#258979;color:white}header a{color:white;font-size:20px;font-weight:800}h1{font-size:clamp(32px,5vw,45px);margin:14px 0}header p{font-size:21px;margin:0}main{max-width:960px;margin:auto;padding:20px 16px 70px}.panel{background:white;border:3px solid #b7dfd1;border-radius:25px;padding:22px;margin:20px 0;box-shadow:0 7px 0 #cae7d8}h2{font-size:29px;margin:0 0 16px}.note{font-size:21px;line-height:1.55}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{padding:17px;border-radius:19px;background:#f0fbf5;border:2px solid #c4e7d4}.card strong{font-size:31px;color:#135d56}.card p{font-size:22px;margin:8px 0}.example{font-size:21px;line-height:1.5;color:#425f53}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,.button{font:800 20px ui-rounded,system-ui,sans-serif;cursor:pointer;border:2px solid #197b6b;border-radius:14px;background:#fff;color:#125e54;padding:12px 16px;min-height:52px;text-decoration:none}button:hover,.button:hover{background:#dff5e9}button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #ec9c36;outline-offset:3px}.primary{background:#238b7c;color:white}.primary:hover{background:#176d62;color:white}.small{font-size:18px;padding:8px 11px;min-height:44px}.prompt{font-size:29px;font-weight:800;margin:18px 0}.muted{font-size:20px;color:#4d695d}.feedback{font-size:22px;font-weight:800;min-height:2em;margin:12px 0;color:#0f6860}.feedback.bad{color:#ae4257}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choices button{text-align:left;font-size:27px;padding:18px;overflow-wrap:anywhere}.choices button[disabled]{opacity:.6}.progress{font-size:21px;font-weight:700}.bar{height:15px;background:#d7eee2;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#40a986;transition:width .2s}.writebox{border:3px dashed #79bfa5;border-radius:17px;background:white;width:100%;height:220px;touch-action:none;user-select:none;-webkit-user-select:none;display:block}.answer{font-size:26px;font-weight:800;color:#146c64}input[type=text]{width:min(100%,440px);font-size:27px;padding:13px;border:2px solid #76b29c;border-radius:13px}details{font-size:21px;margin:10px 0}summary{cursor:pointer;font-weight:800}.hide{display:none!important}@media(max-width:600px){.panel{padding:16px}.choices{grid-template-columns:1fr}h2{font-size:28px}}
</style></head><body><header><a href="../../">← 返回單元目錄</a><h1>🌿 九個單字小冒險</h1><p>swim・soccer・family・tomorrow</p></header><main>
<section class="panel" id="notes"><h2>📖 單字卡</h2><p class="note">先聽、跟讀，再試著用自己的話說出意思。下面的句子是本次練習例句。</p><div id="cards" class="cards"></div></section>
<section class="panel" id="write"><h2>✍️ 單字默寫</h2><p class="note">看中文提示，拿 Apple Pencil、手指或滑鼠寫英文。寫完再展開答案，自己核對。</p><div id="writePrompt" class="prompt"></div><canvas class="writebox" id="board" aria-label="單字手寫區"></canvas><div class="row" style="margin:14px 0"><button id="prev">← 上一字</button><button id="next">下一字 →</button><button id="clear">清除</button><button id="undo">↶ 復原</button><button id="redo">↷ 重做</button></div><details id="writeAnswer"><summary>👀 顯示答案</summary><div id="answer" class="answer"></div></details></section>
<section class="panel" id="quiz"><h2>🧩 單字測驗</h2><p class="note">第一輪選中文意思，第二輪根據中文拼英文。答錯會溫柔提示，結束後可只練錯題。</p><div id="quizPlay"><div id="progress" class="progress"></div><div class="bar"><span id="fill"></span></div><div id="question" class="prompt"></div><div id="choices" class="choices"></div><div id="spell" class="hide"><label for="spellInput" class="muted">輸入英文（of course 記得空格）</label><div class="row"><input type="text" id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="primary" id="checkSpell">對答案</button></div></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button class="primary hide" id="advance">下一題 →</button></div><div id="result" class="hide"><h3 id="resultTitle" class="prompt"></h3><p id="resultText" class="note"></p><div id="missList" class="note"></div><div class="row"><button id="retry" class="primary">只練錯題</button><button id="restart">全部再玩一次</button></div></div></section>
</main><script src="../../scripts/american-pronunciation.js"></script><script>
'use strict';
const words=[
 {en:'swim',zh:'游泳',ex:'I can swim.',icon:'🏊'},
 {en:'cannot',zh:'不能；不會',ex:'I cannot swim today.',icon:'🚫'},
 {en:'of course',zh:'當然',ex:'Of course I can help.',icon:'✨'},
 {en:'can',zh:'能；會；可以',ex:'I can play soccer.',icon:'💪'},
 {en:'sport',zh:'運動（泛指運動項目）',ex:'Soccer is a sport.',icon:'🏅'},
 {en:'soccer',zh:'足球',ex:'We play soccer.',icon:'⚽'},
 {en:'son',zh:'兒子',ex:'He is my son.',icon:'👦'},
 {en:'daughter',zh:'女兒',ex:'She is my daughter.',icon:'👧'},
 {en:'tomorrow',zh:'明天',ex:'See you tomorrow!',icon:'📅'}
];
const $=id=>document.getElementById(id);
const say=t=>{if(window.AmericanPronunciation)AmericanPronunciation.speak(t);else if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}};
words.forEach((w,i)=>{let el=document.createElement('article');el.className='card';let title=document.createElement('strong');title.textContent=w.icon+' '+w.en;let zh=document.createElement('p');zh.textContent=w.zh;let ex=document.createElement('div');ex.className='example';ex.textContent=w.ex;let row=document.createElement('div');row.className='row';let b=document.createElement('button');b.className='small';b.textContent='🔊 單字';b.onclick=()=>say(w.en);let c=document.createElement('button');c.className='small';c.textContent='🔊 例句';c.onclick=()=>say(w.ex);let a=document.createElement('a');a.className='button small';a.href='https://dictionary.cambridge.org/zht/詞典/英語-漢語-繁體/'+encodeURIComponent(w.en);a.target='_blank';a.rel='noopener noreferrer';a.textContent='📖 劍橋字典';row.append(b,c,a);el.append(title,zh,ex,row);$('cards').append(el)});
let wi=0;function writeWord(i){wi=(i+words.length)%words.length;$('writePrompt').textContent=(wi+1)+' / '+words.length+'　'+words[wi].icon+' '+words[wi].zh;$('answer').textContent=words[wi].en;$('writeAnswer').open=false;clearInk(false)}$('prev').onclick=()=>writeWord(wi-1);$('next').onclick=()=>writeWord(wi+1);
const canvas=$('board'),ctx=canvas.getContext('2d');let strokes=[],history=[[]],cursor=0,active=null,box=null,pen=null;function save(){history=history.slice(0,cursor+1);history.push(strokes.map(stroke=>stroke.slice()));cursor=history.length-1}
function paint(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;let W=Math.round(r.width*d),H=Math.round(r.height*d);if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}ctx.clearRect(0,0,W,H);ctx.setTransform(W,0,0,H,0,0);ctx.strokeStyle='#17676b';ctx.fillStyle='#17676b';ctx.lineWidth=3/W;ctx.lineCap='round';ctx.lineJoin='round';for(const stroke of [...strokes,...(pen?[pen]:[])]){for(let i=0;i<stroke.length;i++){const p=stroke[i];if(!p)continue;let prev=i?stroke[i-1]:null;if(prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke()}else{ctx.beginPath();ctx.arc(p.x,p.y,2/W,0,2*Math.PI);ctx.fill()}}}ctx.setTransform(1,0,0,1,0,0)}
function xy(x,y){const xx=(x-box.left)/box.width,yy=(y-box.top)/box.height;return xx>=0&&xx<=1&&yy>=0&&yy<=1?{x:xx,y:yy}:null}
function begin(id,x,y){if(active!==null)return;box=canvas.getBoundingClientRect();active=id;pen=[xy(x,y)];paint()}
function move(id,x,y){if(id!==active)return;let p=xy(x,y);if(p||pen[pen.length-1]!==null)pen.push(p);paint()}
function end(id){if(id!==active)return;if(pen.some(Boolean)){strokes.push(pen);save()}active=null;pen=null;box=null;paint()}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0)return;e.preventDefault();begin('p'+e.pointerId,e.clientX,e.clientY);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;if(active==='p'+e.pointerId){e.preventDefault();move(active,e.clientX,e.clientY)}});for(const t of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(t,e=>{if(e.pointerType!=='touch')end('p'+e.pointerId)});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];if(t)begin('t'+t.identifier,t.clientX,t.clientY)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)move('t'+t.identifier,t.clientX,t.clientY)},{passive:false});for(const type of ['touchend','touchcancel'])canvas.addEventListener(type,e=>{e.preventDefault();for(const t of e.changedTouches)end('t'+t.identifier)},{passive:false});window.addEventListener('blur',()=>{if(active!==null)end(active)});
function clearInk(record=true){if(record&&strokes.length){strokes=[];save()}else if(!record){strokes=[];history=[[]];cursor=0}paint()};$('clear').onclick=()=>clearInk();$('undo').onclick=()=>{if(cursor>0){cursor--;strokes=history[cursor].map(s=>s.slice());paint()}};$('redo').onclick=()=>{if(cursor<history.length-1){cursor++;strokes=history[cursor].map(s=>s.slice());paint()}};new ResizeObserver(paint).observe(canvas);writeWord(0);
// Two questions per word: recognition and spelling. Missed IDs are tracked across the whole round.
const all=words.flatMap((_,i)=>[i,i+words.length]);let queue=all.slice(),at=0,missed=new Set(),correct=0,round=0,locked=false;
function drawQuiz(){if(at>=queue.length){finish();return}locked=false;$('advance').classList.add('hide');$('feedback').textContent='';$('feedback').classList.remove('bad');$('choices').replaceChildren();$('spell').classList.add('hide');let id=queue[at],i=id%words.length,spell=id>=words.length,w=words[i];$('progress').textContent=(round?'錯題練習':'正式測驗')+'　'+(at+1)+' / '+queue.length+'　⭐ '+correct+'　❤️ '+Math.max(0,3-missed.size);$('fill').style.width=(at/queue.length*100)+'%';$('question').textContent=spell?'把「'+w.zh+'」拼成英文：':'「'+w.en+'」是什麼意思？';if(spell){$('spell').classList.remove('hide');$('spellInput').value='';return}let picks=[i,...words.map((_,j)=>j).filter(j=>j!==i).sort((a,b)=>((a*7+i*3)%11)-((b*7+i*3)%11)).slice(0,3)].sort((a,b)=>((a*5+i*7)%13)-((b*5+i*7)%13));for(const j of picks){let b=document.createElement('button');b.textContent=words[j].zh;b.onclick=()=>answer(j===i,w.zh);$('choices').append(b)}}
function answer(ok,solution){if(locked)return;let id=queue[at];if(!ok){missed.add(id);$('feedback').textContent='再想一想：可以回去看單字卡，或再選一次。';$('feedback').classList.add('bad');return}locked=true;if(!missed.has(id))correct++;$('feedback').classList.remove('bad');$('feedback').textContent='答對了！✨ '+words[id%words.length].en+' = '+words[id%words.length].zh;say(words[id%words.length].en);$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('advance').classList.remove('hide')}
$('checkSpell').onclick=()=>{const id=queue[at];answer($('spellInput').value.trim().replace(/\s+/g,' ').toLowerCase()===words[id%words.length].en,words[id%words.length].en)};$('spellInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('checkSpell').click()});$('advance').onclick=()=>{at++;drawQuiz()};
function finish(){$('quizPlay').classList.add('hide');$('result').classList.remove('hide');$('resultTitle').textContent=missed.size?'🎉 完成！再練錯題就更熟了':'🏆 全部一次答對！';$('resultText').textContent='本輪 '+queue.length+' 題，第一次答對 '+correct+' 題；需再練 '+missed.size+' 題。';$('missList').replaceChildren();if(missed.size){let p=document.createElement('p');p.textContent='錯題：'+[...missed].map(id=>words[id%words.length].en+(id>=words.length?'（拼字）':'（意思）')).join('、');$('missList').append(p)}$('retry').classList.toggle('hide',!missed.size)}
function start(ids,isRetry){queue=ids;at=0;missed=new Set();correct=0;round=isRetry?round+1:0;$('result').classList.add('hide');$('quizPlay').classList.remove('hide');drawQuiz()};$('retry').onclick=()=>start([...missed],true);$('restart').onclick=()=>start(all.slice(),false);drawQuiz();
</script></body></html>
